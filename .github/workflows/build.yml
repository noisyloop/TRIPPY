name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    # Changes to documentation alone don't need a build.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Every push to main is a new version: v0.<run number>. A pushed tag uses its own name.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.{0}', github.run_number) }}

jobs:
  content:
    name: Content check + room screenshots (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check rooms, dialogue and duels
        run: python3 scripts/check_content.py --graph
      - name: Build against system SDL2 (fast)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev fonts-dejavu-core
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Screenshot every room
        run: scripts/shot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-screenshots
          path: screenshots/

  macos:
    name: macOS app (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary (Apple Silicon + Intel), SDL2 linked statically
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTRIPPY_VENDOR_SDL=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DTRIPPY_VERSION="${VERSION#v}"
          cmake --build build -j 4
          lipo -info build/trippy
          # Only system frameworks may be linked dynamically.
          otool -L build/trippy
          if otool -L build/trippy | grep -iE 'sdl|homebrew|/usr/local'; then exit 1; fi
      - name: Package TRIPPY-macos.dmg
        run: |
          mkdir -p dist
          packaging/macos/build-dmg.sh "${VERSION#v}" build/trippy dist/TRIPPY-macos.dmg
      - name: Check the packaged app runs and finds its assets
        run: |
          hdiutil attach dist/TRIPPY-macos.dmg -mountpoint /tmp/trippy-dmg -nobrowse
          cp -R /tmp/trippy-dmg/TRIPPY.app "$RUNNER_TEMP/"
          hdiutil detach /tmp/trippy-dmg
          codesign --verify --deep "$RUNNER_TEMP/TRIPPY.app"
          test -f "$RUNNER_TEMP/TRIPPY.app/Contents/Resources/icon.icns"
          cd /tmp
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy "$RUNNER_TEMP/TRIPPY.app/Contents/MacOS/TRIPPY" > run.log 2>&1 &
          PID=$!
          sleep 6
          cat run.log
          kill -0 $PID || { echo "TRIPPY exited early"; exit 1; }
          kill $PID
          if grep -q "no assets/ directory found" run.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: TRIPPY-macos
          path: dist/TRIPPY-macos.dmg

  windows:
    name: Windows (.exe zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, SDL2 linked statically
        shell: bash
        run: |
          cmake -B build -DTRIPPY_VENDOR_SDL=ON -DTRIPPY_VERSION="${VERSION#v}"
          cmake --build build --config Release -j 4
      - name: Package TRIPPY-windows.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\TRIPPY | Out-Null
          Copy-Item build\Release\trippy.exe dist\TRIPPY\
          Copy-Item -Recurse assets dist\TRIPPY\assets
          Remove-Item -Recurse -Force dist\TRIPPY\assets\sprites\legacy
          Copy-Item packaging\windows\README.txt dist\TRIPPY\
          Compress-Archive -Path dist\TRIPPY -DestinationPath dist\TRIPPY-windows.zip
      - name: Check the packaged exe runs and finds its assets
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "$PWD\dist\TRIPPY\trippy.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru `
                 -RedirectStandardError "$env:RUNNER_TEMP\err.log" -RedirectStandardOutput "$env:RUNNER_TEMP\out.log"
          Start-Sleep -Seconds 6
          Get-Content "$env:RUNNER_TEMP\out.log", "$env:RUNNER_TEMP\err.log"
          if ($p.HasExited) { Write-Output "trippy.exe exited early ($($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          if (Select-String -Path "$env:RUNNER_TEMP\err.log" -Pattern "no assets/ directory found" -Quiet) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: TRIPPY-windows
          path: dist/TRIPPY-windows.zip

  release:
    name: Publish GitHub release
    needs: [content, macos, windows]
    # Each push to main (and each v* tag) becomes a release.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: TRIPPY-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/TRIPPY-macos.dmg dist/TRIPPY-windows.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/TRIPPY-macos.dmg dist/TRIPPY-windows.zip \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "TRIPPY ${VERSION#v}" --generate-notes --latest
          fi
